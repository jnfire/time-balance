[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-balance"
dynamic = ["version"]
description = "A small terminal tool to register workdays and keep your hour balance."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Javier Nicolás Pérez Mesa" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["time tracking", "workday", "hour balance", "terminal", "cli"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = ["rich>=10.0.0"]

[project.urls]
Repository = "https://github.com/jnfire/time-balance"
Changelog = "https://github.com/jnfire/time-balance/blob/main/CHANGELOG.md"

[project.scripts]
time-balance = "time_balance.cli.main:main"

[tool.setuptools.dynamic]
version = { file = "time_balance/VERSION" }

[tool.setuptools.packages.find]
include = ["time_balance*"]

[tool.setuptools.package-data]
time_balance = ["VERSION", "i18n/locales/*.json"]
