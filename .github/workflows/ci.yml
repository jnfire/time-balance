name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the package (no development tools)
        run: uv sync --locked --no-dev

      - name: Run the tests
        run: uv run python -m unittest discover -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install the package and the development tools
        run: uv sync --locked

      - name: Check that the lockfile is up to date
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy time_balance

      - name: Tests with coverage
        run: |
          uv run coverage run -m unittest discover
          uv run coverage report --fail-under=90

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Build the wheel and the source distribution
        run: uv build

      - name: Validate the package metadata
        run: uvx twine check --strict dist/*

      - name: Check that the translations are inside the wheel
        run: |
          uv run --no-project python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          needed = ('time_balance/VERSION', 'time_balance/i18n/locales/en.json', 'time_balance/i18n/locales/es.json')
          missing = [name for name in needed if name not in names]
          assert not missing, f'Missing from the wheel: {missing}'
          PY

      - name: Install the wheel in a clean environment and run it
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/time-balance-data"
          uvx --from "$(ls dist/*.whl)" time-balance --version
          uvx --from "$(ls dist/*.whl)" time-balance --status --lang es

      - name: Check that the release notes exist for this version
        run: uv run --no-project python scripts/release_notes.py --tag "v$(cat time_balance/VERSION)" > /dev/null
