name: Release

# Pushing a tag such as v0.6.0 creates the GitHub release, with the matching
# section of CHANGELOG.md as its notes and the wheel and the source
# distribution attached. If the release was already created by hand from the web
# page, the files are attached to it. See docs/DEVELOPMENT.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Check the tag and extract the release notes from CHANGELOG.md
        run: uv run --no-project python scripts/release_notes.py --tag "$GITHUB_REF_NAME" > release-notes.md

      - name: Build the wheel and the source distribution
        run: uv build

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists (for example, it was created by hand from the GitHub web page). Attaching the files to it."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag dist/*
